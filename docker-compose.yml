services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-llm-app:local}
    build:
      context: ./app
    environment:
      OLLAMA_URL: http://ollama:11434
      MODEL: ${MODEL:-llama3.2:3b}
      ACCESS_CODE: ${ACCESS_CODE:-}
    ports:
      - "80:8000"
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama:
